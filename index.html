<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог МЕТРЫ — 2026</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#f1eee8;color:#29231f;font-family:Arial,Helvetica,sans-serif}body{min-height:100dvh} .wrap{max-width:1500px;margin:auto;padding:16px 22px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{padding-bottom:15px}.brand{font-size:20px;letter-spacing:.06em;font-weight:700}.brand small{font-size:12px;font-weight:400;letter-spacing:0;color:#8d7a70;margin-left:12px}.stage{position:relative;overflow:hidden;border-radius:14px;background:#ddd5ce;box-shadow:0 12px 30px #34221a18;touch-action:pan-y}.stage img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;transition:opacity .22s, transform .22s}.stage img.switch{opacity:.25;transform:scale(.985)}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:43px;height:54px;background:#f6f3eeed;border:0;border-radius:8px;cursor:pointer;color:#3c2a23;font-size:30px;z-index:2}.left{left:14px}.right{right:14px}.arrow:hover{background:#fff}.bottom{padding:14px 0 4px}.nav{display:flex;align-items:center;gap:14px}.btn{border:1px solid #bcafa5;background:transparent;color:#342c27;border-radius:100px;padding:10px 16px;cursor:pointer;text-decoration:none;font-size:13px}.btn:hover{background:#e7dcd4}.count{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}input[type=range]{accent-color:#9b432a;max-width:270px;width:28vw}.hint{color:#87736a;font-size:12px}.stage:fullscreen{background:#151311;display:flex;align-items:center;justify-content:center;border-radius:0}.stage:fullscreen img{max-height:100vh;width:100%;height:auto;object-fit:contain}.stage:fullscreen .arrow{position:fixed}@media(max-width:700px){.wrap{padding:10px}.brand{font-size:16px}.brand small,.hint{display:none}.stage{border-radius:6px}.arrow{width:29px;height:38px;font-size:22px;opacity:.8}.left{left:6px}.right{right:6px}.bottom{flex-wrap:wrap}.btn{padding:9px 12px}input[type=range]{width:24vw}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">МЕТРЫ <small>Каталог смарт-квартир · 2026</small></div><button id="fs" class="btn">⛶ На весь экран</button></header><section id="stage" class="stage" aria-label="Презентация каталога"><button class="arrow left" id="prev" aria-label="Предыдущий слайд">‹</button><img id="slide" src="slides/01.webp" alt="Слайд 1" draggable="false"><button class="arrow right" id="next" aria-label="Следующий слайд">›</button></section><footer class="bottom"><div class="nav"><button id="back" class="btn">← Назад</button><span id="count" class="count">01 / 36</span><button id="forward" class="btn">Далее →</button></div><input aria-label="Номер страницы" id="range" type="range" min="1" max="36" value="1"><span class="hint">Листайте свайпом или стрелками клавиатуры</span></footer></main>
<script>const N=36,img=document.getElementById('slide'),count=document.getElementById('count'),range=document.getElementById('range'),stage=document.getElementById('stage');let current=1,busy=false,startX=0,startY=0;
function url(n){return 'slides/'+String(n).padStart(2,'0')+'.webp'}function preload(n){if(n>=1&&n<=N){const p=new Image();p.src=url(n)}}
function go(n){n=Math.max(1,Math.min(N,n));if(n===current)return;current=n;img.classList.add('switch');const p=new Image();p.onload=()=>{img.src=p.src;img.alt='Слайд '+current;img.classList.remove('switch')};p.onerror=()=>{img.classList.remove('switch');img.alt='Не удалось загрузить слайд '+current};p.src=url(n);count.textContent=String(current).padStart(2,'0')+' / '+N;range.value=current;preload(n+1);preload(n-1)}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('back').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('forward').onclick=()=>go(current+1);range.addEventListener('input',e=>go(+e.target.value));document.getElementById('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(stage.requestFullscreen)stage.requestFullscreen()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});stage.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(d)>45&&Math.abs(d)>Math.abs(dy)*1.2)go(current+(d<0?1:-1))},{passive:true});preload(2);
</script></body></html>
